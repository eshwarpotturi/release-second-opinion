const $=s=>document.querySelector(s),root=document.documentElement;

const pc=(a,b)=>Math.round(100*a/b);

function tbl(rs){return '<table><tr><th>Release</th><th>Feature</th><th>Change</th><th>Section</th></tr>'+rs.map(r=>`<tr><td>${r.release}</td><td>${r.feature}${r.desc?`<div style="font-size:15px;color:var(--ink2)">${r.desc}</div>`:''}</td><td class="${r.dir==='down'?'dn':'upc'}">${r.frm} → ${r.to}${r.cross?' ⚑':''}</td><td>${r.section==='Unmatched'?'Not known':r.section}</td></tr>`).join('')+'</table><p style="font-size:16px">⚑ changes whether the feature is tested (Medium and High are tested).</p>'}
function show(t,p,rs){$('#mb').innerHTML=`<h2>${t}</h2><p>${p}</p>`+tbl(rs);$('#m').style.display='flex'}
const R=D.rows,by=f=>R.filter(f);

let h='';

h+=`<div class="card c4" id="k3"><div class="k">${pc(D.cross,D.n)}%</div><div class="kl">changed whether the feature gets tested (${D.cross} of ${D.n})</div></div>`;

const mx=Math.max(...D.order.map(k=>D.rel[k][0]+D.rel[k][1]));
h+=`<div class="card c6"><h2>By release</h2><p class="n">Red: lowered. Blue: raised. Click a bar.</p><div class="rel">`+D.order.map(k=>{const[d,u]=D.rel[k],t=d+u;return `<div class="rc" data-r="${k}"><div class="s" style="height:${200*u/mx}px;background:var(--up)"></div><div class="s" style="height:${200*d/mx}px;background:var(--down)"></div></div>`}).join('')+`</div><div class="lab">`+D.order.map(k=>`<div>${k}</div>`).join('')+`</div><p class="n" style="margin-top:8px">Releases 21R3 to 25R2 do not publish old and new ratings, so they are not shown.</p></div>`;
const sk=Object.keys(D.sec).sort((a,b)=>D.sec[b][0]+D.sec[b][1]-D.sec[a][0]-D.sec[a][1]),sm=Math.max(...sk.map(k=>D.sec[k][0]));

const L=['High','Medium','Low','N/A'],cmax=Math.max(...L.flatMap(f=>L.map(t=>D.mat[f][t])));
h+=`<div class="card c12"><h2>Where ratings move</h2><p class="n">Old rating (rows) to new rating (columns). Click a cell.</p><div class="mx"><b></b>`+L.map(t=>`<b>to ${t}</b>`).join('')+L.map(f=>`<b style="text-align:right;padding-top:12px">from ${f}</b>`+L.map(t=>{const v=D.mat[f][t],lo=L.indexOf(t)>L.indexOf(f),c=lo?'208,59,59':'42,120,214';return f===t?`<div></div>`:`<div class="mc" data-f="${f}" data-t="${t}" style="background:rgba(${c},${v?0.15+0.7*v/cmax:0.04});">${v}</div>`}).join('')).join('')+`</div></div>`;
$('#g').innerHTML=h;
const eL=pc(...D.early),lL=pc(...D.late);
$('#ft').innerHTML=`Counts: ${D.early[0]} of ${D.early[1]} corrections lowered in 2019 to 2021, ${D.late[0]} of ${D.late[1]} in 2025 to 2026. Source: 23 public Veeva Vault release impact assessments, 2019 to 2026. Only releases 19R1 to 21R2 and 25R3 to 26R2 publish old and new ratings.`;
$('#k1').onclick=$('#b1').onclick=()=>show('All corrections','Every rating Veeva changed after publishing, with old and new rating.',R);

$('#k3').onclick=()=>show('Changed the testing decision',`${D.off} lowered a rating from Medium or High to Low or N/A, so testing is switched off. ${D.on} raised it, so testing is switched on.`,by(r=>r.cross));
